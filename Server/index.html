<!doctype html>
<html>
  <head>
    <title>Add Product</title>
  </head>
  <body>
    
<section style="display: flex;">
<div>
<h1>Add Product</h1>
    
    <form action="http://localhost:3001/add-product" method="POST">
      <h2>Product Information</h2>

      <label for="product_name">Product Name</label><br />
      <input type="text" id="product_name" name="product_name" required /><br /><br />

      <label for="product_url">Product URL</label><br />
      <input type="text" id="product_url" name="product_url" required /><br /><br />

      <h2>Product Description</h2>

      <label for="product_brief_description">Brief Description</label><br />
      <input
        type="text"
        id="product_brief_description"
        name="product_brief_description"
      /><br /><br />

      <label for="product_description">Full Description</label><br />
      <textarea
        id="product_description"
        name="product_description"
        rows="5"
        cols="40"
      ></textarea><br /><br />

      <label for="product_img">Product Image URL</label><br />
      <input type="text" id="product_img" name="product_img" /><br /><br />

      <label for="product_link">Product Link</label><br />
      <input type="text" id="product_link" name="product_link" /><br /><br />

      <h2>Product Price</h2>

      <label for="starting_price">Starting Price</label><br />
      <input
        type="text"
        id="starting_price"
        name="starting_price"
      /><br /><br />

      <label for="price_range">Price Range</label><br />
      <input
        type="text"
        id="price_range"
        name="price_range"
      /><br /><br />


      <h2>user information</h2>
<label for="user_name">User name</label><br />
      <input
        type="text"
        name="user_name"
      /><br /><br />

      <label for="user_password">User password</label><br />
      <input
        type="text"
        name="user_password"
      /><br /><br />
      <button type="submit">Save Product</button>
    </form>
 </div>
<div>
<button type="button" onclick="toggleProducts()"><h3>Show Products</h3></button>

<div id="productsContainer" style="display:none; margin-top:20px;">
  <table border="1" cellpadding="10">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>URL</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody id="productsBody"></tbody>
  </table>
</div>
</div>
</section>

<script>
  let productsLoaded = false;

  function toggleProducts() {
    const container = document.getElementById("productsContainer");
    const button = event.target;

    // If already visible, hide it
    if (container.style.display === "block") {
      container.style.display = "none";
      button.textContent = "Show Products";
      return;
    }

    // Show it
    container.style.display = "block";
    button.textContent = "Hide Products";

    // Only fetch once
    if (!productsLoaded) {
      fetch("http://localhost:3001/products")
        .then((response) => response.json())
        .then((products) => {
          const body = document.getElementById("productsBody");

          products.forEach((product) => {
            body.innerHTML += `
              <tr>
                <td>${product.product_id}</td>
                <td>${product.product_name}</td>
                <td>${product.product_url}</td>
                <td>${product.starting_price}</td>
              </tr>
            `;
          });

          productsLoaded = true;
        })
        .catch((err) => console.log(err));
    }
  }
</script>





  </body>
</html>
